[workspace]
members = [
  "crates/sim-protocol",
  "crates/sim-core",
  "crates/sim-wasm",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ts-rs = "12.0.1"
wasm-bindgen = "0.2.100"
